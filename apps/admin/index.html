<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- dash.entuned.co is an internal operator console on a public host, and
         the entuned.co Search Console property is a Domain property, so Google
         crawls it. The player and dashboard apps have carried this tag from the
         start; admin was the one that missed it. Left crawlable on purpose —
         robots.txt Disallow would stop Google fetching the page and therefore
         stop it ever seeing this noindex. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>entuned admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; width: 100%; }
      body { background: #20201c; color: #d4e1e5; font-family: 'Inter', sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
